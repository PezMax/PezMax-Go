          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 新增菜单
      tags:
      - 菜单管理
    put:
      parameters:
      - description: 菜单位置列表
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.menuLayoutPayload'
