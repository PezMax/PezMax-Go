        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新菜单布局
      tags:
      - 菜单管理
  /admin-menus/{id}:
    delete:
      parameters:
