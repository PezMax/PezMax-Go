basePath: /api
consumes:
- application/json
definitions:
  kadmin.SwaggerErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      data: {}
      message:
        example: invalid request
        type: string
      msg:
        example: invalid request
        type: string
    type: object
  kadmin.SwaggerJobPayload:
    properties:
      cronExpression:
        type: string
      description:
        type: string
      handler:
        type: string
      name:
        type: string
      parameters:
        type: object
      status:
        type: string
    type: object
  kadmin.SwaggerResponse:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      message:
        example: ok
        type: string
      msg:
        example: ok
        type: string
    type: object
  kadmin.deleteLogsPayload:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  kadmin.departmentPayload:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      sort:
        type: integer
      status:
        type: integer
    type: object
  kadmin.departmentRolesPayload:
    properties:
      roleIds:
        items:
          type: integer
        type: array
    type: object
  kadmin.dictionaryDataPayload:
    properties:
      color:
        type: string
      cssClass:
        type: string
      dictType:
        type: string
      isDefault:
        type: boolean
      label:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      value:
        type: string
    type: object
  kadmin.dictionaryTypePayload:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      sort:
        type: integer
      status:
        type: integer
    type: object
  kadmin.importUsersPayload:
    properties:
      content:
        type: string
      format:
        type: string
    type: object
  kadmin.loginRequest:
    properties:
      captchaAnswer:
        type: string
      captchaId:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  kadmin.menuLayoutPayload:
    properties:
      items:
        items:
          $ref: '#/definitions/kadmin.menuPosition'
        type: array
    type: object
  kadmin.menuPayload:
    properties:
      component:
        type: string
      header:
        type: string
      icon:
        type: string
      order:
        type: integer
      parentId:
        type: integer
      pluginName:
        type: string
      title:
        type: string
      type:
        type: integer
      uri:
        type: string
      uuid:
        type: string
    type: object
  kadmin.menuPosition:
    properties:
      id:
        type: integer
      order:
        type: integer
      parentId:
        type: integer
    type: object
  kadmin.refreshTokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  kadmin.resetPasswordPayload:
    properties:
      password:
        type: string
    type: object
  kadmin.roleMenuPayload:
    properties:
      menuIds:
        items:
          type: integer
        type: array
    type: object
  kadmin.rolePayload:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  kadmin.rolePermissionsPayload:
    properties:
      permissionIds:
        items:
          type: integer
        type: array
    type: object
  kadmin.roleUsersPayload:
    properties:
      userIds:
        items:
          type: integer
        type: array
    type: object
  kadmin.systemConfigItem:
    properties:
      builtin:
        type: boolean
      description:
        type: string
      future:
        type: boolean
      key:
        type: string
      label:
        type: string
      options:
        items:
          type: string
        type: array
      type:
        type: string
      value:
        type: string
    type: object
  kadmin.systemConfigPayload:
    properties:
      items:
        items:
          $ref: '#/definitions/kadmin.systemConfigItem'
        type: array
    type: object
  kadmin.unlockUserPayload:
    properties:
      ip:
        type: string
    type: object
  kadmin.userPayload:
    properties:
      avatar:
        type: string
      name:
        type: string
      password:
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        type: string
      username:
        type: string
    type: object
  kadmin.userStatusPayload:
    properties:
      status:
        type: string
    type: object
  product.ProductPayload:
    properties:
      active:
        type: boolean
      description:
        type: string
      name:
        type: string
      price:
        type: number
      publishedAt:
        type: string
      sku:
        type: string
      stock:
        type: integer
    type: object
info:
  contact: {}
  description: KAdmin 前后端分离接口文档。除登录、刷新令牌和公开配置外，请使用 Bearer Token 调用接口。
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: KAdmin API
  version: "1.0"
paths:
  /admin-menus:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取菜单管理列表
      tags:
      - 菜单管理
    post:
      parameters:
      - description: 菜单信息
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.menuPayload'
      - description: 幂等键（8-128 位）
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 新增菜单
      tags:
      - 菜单管理
    put:
      parameters:
      - description: 菜单位置列表
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.menuLayoutPayload'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新菜单布局
      tags:
      - 菜单管理
  /admin-menus/{id}:
    delete:
      parameters:
      - description: 菜单 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除菜单
      tags:
      - 菜单管理
    put:
      parameters:
      - description: 菜单 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 菜单信息
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.menuPayload'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改菜单
      tags:
      - 菜单管理
  /admin-menus/tree:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取菜单管理树
      tags:
      - 菜单管理
  /auth/captcha:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      summary: 获取一次性登录验证码
      tags:
      - 认证
  /auth/codes:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取权限码
      tags:
      - 认证
  /auth/login:
    post:
      parameters:
      - description: 登录信息
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.loginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      summary: 登录
      tags:
      - 认证
  /auth/logout:
    post:
      parameters:
      - description: 刷新令牌
        in: body
        name: payload
        schema:
          $ref: '#/definitions/kadmin.refreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /auth/refresh:
    post:
      parameters:
      - description: 刷新令牌
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.refreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      summary: 刷新令牌
      tags:
      - 认证
  /codegen/candidates:
    get:
      parameters:
      - description: 表名关键词
        in: query
        name: keyword
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询可导入的数据库表
      tags:
      - 代码生成
  /codegen/configs/{id}:
    delete:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除代码生成配置
      tags:
      - 代码生成
    get:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取代码生成配置详情
      tags:
      - 代码生成
    put:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 模块名、类名、业务名、路由前缀与列配置
        in: body
        name: payload
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改代码生成配置
      tags:
      - 代码生成
  /codegen/configs/{id}/download:
    get:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 打包下载生成的代码
      tags:
      - 代码生成
  /codegen/configs/{id}/generate:
    post:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      - description: confirmOverwrite 是否覆盖无生成标记的冲突文件
        in: body
        name: payload
        schema:
          type: object
      - description: 幂等键（8-128 位）
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 生成代码到项目目录
      tags:
      - 代码生成
  /codegen/configs/{id}/preview:
    post:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 预览生成的代码文件
      tags:
      - 代码生成
  /codegen/tables:
    get:
      parameters:
      - description: 表名或业务名关键词
        in: query
        name: keyword
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询代码生成配置列表
      tags:
      - 代码生成
  /codegen/tables/import:
    post:
      parameters:
      - description: 表名与可选生成配置
        in: body
        name: payload
        required: true
        schema:
          type: object
      - description: 幂等键（8-128 位）
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 导入数据库表
      tags:
      - 代码生成
  /dictionaries/data:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 字典类型 ID
        in: query
        name: typeId
        type: integer
      - description: 关键词
        in: query
        name: keyword
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询字典数据
      tags:
      - 字典管理
    post:
      parameters:
      - description: 字典数据
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.dictionaryDataPayload'
      - description: 幂等键（8-128 位）
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 新增字典数据
      tags:
      - 字典管理
  /dictionaries/data/{id}:
    delete:
      parameters:
      - description: 字典数据 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除字典数据
      tags:
      - 字典管理
    put:
      parameters:
      - description: 字典数据 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 字典数据
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.dictionaryDataPayload'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改字典数据
      tags:
      - 字典管理
  /dictionaries/overview:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取字典概览
      tags:
      - 字典管理
  /dictionaries/types:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 关键词
        in: query
        name: keyword
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询字典类型
      tags:
      - 字典管理
    post:
      parameters:
      - description: 字典类型
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.dictionaryTypePayload'
      - description: 幂等键（8-128 位）
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 新增字典类型
      tags:
      - 字典管理
  /dictionaries/types/{id}:
    delete:
      parameters:
      - description: 字典类型 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除字典类型
      tags:
      - 字典管理
    put:
      parameters:
      - description: 字典类型 ID
