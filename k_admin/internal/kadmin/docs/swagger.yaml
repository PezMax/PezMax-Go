      parameters:
      - description: 开始时间（RFC3339），默认最近 1 小时
        in: query
        name: startedAt
        type: string
      - description: 结束时间（RFC3339），默认当前时间
        in: query
        name: endedAt
        type: string
      - description: 按接口路径模糊筛选
        in: query
        name: route
        type: string
      - description: 按请求方法筛选
        in: query
        name: method
        type: string
      - description: 按状态码筛选（100-599）
        in: query
        name: statusCode
        type: integer
      - description: 聚合维度：route / method / status
        in: query
        name: groupBy
        type: string
      - description: 排序维度：requestCount / qps / errorRate / avgDurationMs
        in: query
        name: dimension
        type: string
      - description: 排序方向：asc / desc
        in: query
        name: order
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数（最大 100）
        in: query
        name: pageSize
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
        "403":
          description: Forbidden
