paths:
  /admin-menus:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kadmin.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取菜单管理列表
      tags:
      - 菜单管理
    post:
      parameters:
      - description: 菜单信息
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/kadmin.menuPayload'
      - description: 幂等键（8-128 位）
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kadmin.SwaggerResponse'
        "400":
