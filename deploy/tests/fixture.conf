map $http_authorization $fixture_token_valid {
    default 0;
    "Bearer test-token-1" 1;
    "Bearer test-token-2" 1;
    "Bearer test-token-3" 1;
    "Bearer test-token-4" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log off;
    gzip off;

    location = /health {
        return 200 "fixture ready\n";
    }

    # Only the fixture checks these distinct headers. Production authentication
    # is deliberately outside this network-shaping regression test.
    location = /datum/download/file {
        if ($fixture_token_valid = 0) { return 401; }
        default_type application/octet-stream;
        alias /fixtures/payload.bin;
    }

    location = /ordinary/payload.bin {
        if ($fixture_token_valid = 0) { return 401; }
        default_type application/octet-stream;
        alias /fixtures/payload.bin;
    }

    location / { return 404; }
}
