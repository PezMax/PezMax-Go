name: pezmax-go

services:
  postgres:
    image: postgres:16-alpine
    container_name: pezmax-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PEZMAX_DB_NAME:-pezmax}
      POSTGRES_USER: ${PEZMAX_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PEZMAX_DB_PASSWORD:-pezmax_dev_pwd}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${PEZMAX_DB_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./k_admin/tests/data/admin_pg.sql:/docker-entrypoint-initdb.d/10-admin_pg.sql:ro
      - ./k_admin/sql/ptmj_schema.sql:/docker-entrypoint-initdb.d/20-ptmj_schema.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pezmax-go-redis
    restart: unless-stopped
    environment:
      PEZMAX_REDIS_PASSWORD: ${PEZMAX_REDIS_PASSWORD:-pezmax_redis_pwd}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${PEZMAX_REDIS_PASSWORD:-pezmax_redis_pwd}
    ports:
      - "${PEZMAX_REDIS_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${PEZMAX_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: pezmax-go-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${PEZMAX_MINIO_ACCESS_KEY:-pezmax_minio}
      MINIO_ROOT_PASSWORD: ${PEZMAX_MINIO_SECRET_KEY:-pezmax_minio_pwd}
      TZ: Asia/Shanghai
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "${PEZMAX_MINIO_API_PORT:-29000}:9000"
      - "${PEZMAX_MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    container_name: pezmax-go-minio-init
    environment:
      MINIO_ROOT_USER: ${PEZMAX_MINIO_ACCESS_KEY:-pezmax_minio}
      MINIO_ROOT_PASSWORD: ${PEZMAX_MINIO_SECRET_KEY:-pezmax_minio_pwd}
      MINIO_BUCKET: ${PEZMAX_MINIO_BUCKET:-ptmj}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    networks:
      - backend
    depends_on:
      - minio

  # KAdmin 应用服务（可选）：内置 LibreOffice 转档器。
  # 默认 docker compose up 不启动；docker compose --profile app up -d kadmin 启用。
  # 本机开发（Go 直跑宿主机）无需此服务，LibreOffice 改为宿主机安装。
  kadmin:
    build:
      context: ./k_admin
      dockerfile: Dockerfile.app
    container_name: pezmax-go-kadmin
    restart: unless-stopped
    profiles:
      - app
    environment:
      KADMIN_DB_HOST: postgres
      KADMIN_DB_PORT: "5432"
      KADMIN_DB_NAME: ${PEZMAX_DB_NAME:-pezmax}
      KADMIN_DB_USER: ${PEZMAX_DB_USER:-postgres}
      KADMIN_DB_PASSWORD: ${PEZMAX_DB_PASSWORD:-pezmax_dev_pwd}
      KADMIN_REDIS_HOST: redis
      KADMIN_REDIS_PORT: "6379"
      KADMIN_REDIS_PASSWORD: ${PEZMAX_REDIS_PASSWORD:-pezmax_redis_pwd}
      KADMIN_JWT_SECRET: ${KADMIN_JWT_SECRET:-8kF2xPqL9mN4vR7wJ1bY6tH3zA0c}
      KADMIN_APP_PORT: "9033"
      KADMIN_MINIO_ENABLED: "true"
      KADMIN_MINIO_ENDPOINT: http://minio:9000
      KADMIN_MINIO_INTERNAL_ENDPOINT: http://minio:9000
      KADMIN_MINIO_PUBLIC_BASE: ${PEZMAX_MINIO_PUBLIC_BASE:-http://127.0.0.1:29000}
      KADMIN_MINIO_ACCESS_KEY: ${PEZMAX_MINIO_ACCESS_KEY:-pezmax_minio}
      KADMIN_MINIO_SECRET_KEY: ${PEZMAX_MINIO_SECRET_KEY:-pezmax_minio_pwd}
      KADMIN_MINIO_BUCKET: ${PEZMAX_MINIO_BUCKET:-ptmj}
      KADMIN_DATUM_SESSION_TTL: 120h
      TZ: Asia/Shanghai
    ports:
      - "${PEZMAX_APP_PORT:-9033}:9033"
    volumes:
      - kadmin_uploads:/app/uploads
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

networks:
  backend:
    name: pezmax-go-backend

volumes:
  postgres_data:
    name: pezmax-go-postgres-data
  redis_data:
    name: pezmax-go-redis-data
  minio_data:
    name: pezmax-go-minio-data
  kadmin_uploads:
    name: pezmax-go-kadmin-uploads
