name: pezmax-go

services:
  postgres:
    # pgvector 官方镜像基于同主版本 PostgreSQL 16，pgvector/pg_trgm 扩展已内置；
    # 与 postgres:16-alpine 共享同一数据目录，迁移只换镜像、不换卷。
    image: ${PEZMAX_DB_IMAGE:-pgvector/pgvector:pg16}
    container_name: pezmax-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PEZMAX_DB_NAME:-pezmax}
      POSTGRES_USER: ${PEZMAX_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PEZMAX_DB_PASSWORD:?Set PEZMAX_DB_PASSWORD in .env}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${PEZMAX_DB_BIND_IP:-127.0.0.1}:${PEZMAX_DB_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./k_admin/tests/data/admin_pg.sql:/docker-entrypoint-initdb.d/10-admin_pg.sql:ro
      - ./k_admin/sql/ptmj_schema.sql:/docker-entrypoint-initdb.d/20-ptmj_schema.sql:ro
      - ./k_admin/sql/extensions.sql:/docker-entrypoint-initdb.d/30-extensions.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pezmax-go-redis
    restart: unless-stopped
    environment:
      PEZMAX_REDIS_PASSWORD: ${PEZMAX_REDIS_PASSWORD:?Set PEZMAX_REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${PEZMAX_REDIS_PASSWORD:?Set PEZMAX_REDIS_PASSWORD in .env}
    ports:
      - "${PEZMAX_REDIS_BIND_IP:-127.0.0.1}:${PEZMAX_REDIS_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${PEZMAX_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: pezmax-go-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${PEZMAX_MINIO_ACCESS_KEY:?Set PEZMAX_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${PEZMAX_MINIO_SECRET_KEY:?Set PEZMAX_MINIO_SECRET_KEY in .env}
      TZ: Asia/Shanghai
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "${PEZMAX_MINIO_BIND_IP:-127.0.0.1}:${PEZMAX_MINIO_API_PORT:-29000}:9000"
      - "${PEZMAX_MINIO_BIND_IP:-127.0.0.1}:${PEZMAX_MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  minio-init:
    image: minio/minio:latest
    container_name: pezmax-go-minio-init
    environment:
      MINIO_ROOT_USER: ${PEZMAX_MINIO_ACCESS_KEY:?Set PEZMAX_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${PEZMAX_MINIO_SECRET_KEY:?Set PEZMAX_MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${PEZMAX_MINIO_BUCKET:-ptmj}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    networks:
      - backend
    depends_on:
      - minio

  # KAdmin 应用服务（可选）：内置 LibreOffice 转档器。
  # 默认 docker compose up 不启动；docker compose --profile app up -d kadmin 启用。
  # 本机开发（Go 直跑宿主机）无需此服务，LibreOffice 改为宿主机安装。
  kadmin:
    build:
      context: ./k_admin
      dockerfile: Dockerfile.app
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEBIAN_MIRROR: ${PEZMAX_DEBIAN_MIRROR:-}
        HTTP_PROXY: ${PEZMAX_BUILD_PROXY:-}
        HTTPS_PROXY: ${PEZMAX_BUILD_PROXY:-}
        http_proxy: ${PEZMAX_BUILD_PROXY:-}
        https_proxy: ${PEZMAX_BUILD_PROXY:-}
    image: pezmax-go-kadmin:${PEZMAX_RELEASE_SHA:-local}
    container_name: pezmax-go-kadmin
    restart: unless-stopped
    profiles:
      - app
    environment:
      KADMIN_DB_HOST: postgres
      KADMIN_DB_PORT: "5432"
      KADMIN_DB_NAME: ${PEZMAX_DB_NAME:-pezmax}
      KADMIN_DB_USER: ${PEZMAX_DB_USER:-postgres}
      KADMIN_DB_PASSWORD: ${PEZMAX_DB_PASSWORD:?Set PEZMAX_DB_PASSWORD in .env}
      KADMIN_REDIS_HOST: redis
      KADMIN_REDIS_PORT: "6379"
      KADMIN_REDIS_PASSWORD: ${PEZMAX_REDIS_PASSWORD:?Set PEZMAX_REDIS_PASSWORD in .env}
      KADMIN_JWT_SECRET: ${KADMIN_JWT_SECRET:?Set KADMIN_JWT_SECRET in .env}
      KADMIN_APP_HOST: "0.0.0.0"
      KADMIN_APP_PORT: "9033"
      # 生产容器：release 模式 + 出站 QoS 默认开启（bulk=下载/头像/封面 共享 80% 上行桶）
      KADMIN_APP_DEBUG: ${KADMIN_APP_DEBUG:-false}
      KADMIN_QOS_UPLINK_MBPS: ${KADMIN_QOS_UPLINK_MBPS:-}
      KADMIN_QOS_BULK_SHARE: ${KADMIN_QOS_BULK_SHARE:-}
      KADMIN_QOS_BURST_MB: ${KADMIN_QOS_BURST_MB:-}
      KADMIN_MINIO_ENABLED: "true"
      KADMIN_MINIO_ENDPOINT: http://minio:9000
      KADMIN_MINIO_INTERNAL_ENDPOINT: http://minio:9000
      KADMIN_MINIO_PUBLIC_BASE: ${PEZMAX_MINIO_PUBLIC_BASE:-http://127.0.0.1:29000}
      KADMIN_MINIO_ACCESS_KEY: ${PEZMAX_MINIO_ACCESS_KEY:?Set PEZMAX_MINIO_ACCESS_KEY in .env}
      KADMIN_MINIO_SECRET_KEY: ${PEZMAX_MINIO_SECRET_KEY:?Set PEZMAX_MINIO_SECRET_KEY in .env}
      KADMIN_MINIO_BUCKET: ${PEZMAX_MINIO_BUCKET:-ptmj}
      KADMIN_DATUM_SESSION_TTL: 120h
      TZ: Asia/Shanghai
    ports:
      - "${PEZMAX_APP_BIND_IP:-127.0.0.1}:${PEZMAX_APP_PORT:-9033}:9033"
    volumes:
      - kadmin_uploads:/app/uploads
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  admin-web:
    build:
      context: ./k_admin/admin-web
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        HTTP_PROXY: ${PEZMAX_BUILD_PROXY:-}
        HTTPS_PROXY: ${PEZMAX_BUILD_PROXY:-}
        http_proxy: ${PEZMAX_BUILD_PROXY:-}
        https_proxy: ${PEZMAX_BUILD_PROXY:-}
    image: pezmax-go-admin-web:${PEZMAX_RELEASE_SHA:-local}
    container_name: pezmax-go-admin-web
    restart: unless-stopped
    profiles:
      - app
    ports:
      - "${PEZMAX_APP_BIND_IP:-127.0.0.1}:${PEZMAX_ADMIN_WEB_PORT:-18088}:80"
    networks:
      - backend
    depends_on:
      - kadmin

  # Nginx 边缘反代（可选）：出站 gzip + 大文件下载限并发/限速。
  # 上行受限的主机建议启用：docker compose --profile edge up -d edge
  # 后端在宿主机直跑（Go 直跑）时，把 KADMIN_EDGE_UPSTREAM 改为
  # host.docker.internal:9033；compose 内跑 kadmin 时默认值即可。
  # 不设 depends_on：后端可能运行在宿主机而非 compose 内。
  edge:
    build:
      context: ./deploy
      dockerfile: Dockerfile.edge
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        ALPINE_MIRROR: ${KADMIN_EDGE_APK_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
        HTTP_PROXY: ${PEZMAX_BUILD_PROXY:-}
        HTTPS_PROXY: ${PEZMAX_BUILD_PROXY:-}
        http_proxy: ${PEZMAX_BUILD_PROXY:-}
        https_proxy: ${PEZMAX_BUILD_PROXY:-}
    image: pezmax-go-edge:${PEZMAX_RELEASE_SHA:-local}
    container_name: pezmax-go-edge
    restart: unless-stopped
    profiles:
      - edge
    cap_add:
      - NET_ADMIN
    environment:
      KADMIN_UPSTREAM: ${KADMIN_EDGE_UPSTREAM:-kadmin:9033}
      # 整个 edge 出口共享预算（tc 单位为 bit/s；8mbit 约 1MB/s）。
      KADMIN_EDGE_EGRESS_RATE: ${KADMIN_EDGE_EGRESS_RATE:-8mbit}
      KADMIN_EDGE_EGRESS_BURST_BYTES: ${KADMIN_EDGE_EGRESS_BURST_BYTES:-32768}
      # 单请求分档用于流量分配，总出口上限由共享内核队列保证。
      KADMIN_EDGE_DL_RATE_FAST: ${KADMIN_EDGE_DL_RATE_FAST:-5m}
      KADMIN_EDGE_DL_RATE_MID: ${KADMIN_EDGE_DL_RATE_MID:-2560k}
      KADMIN_EDGE_DL_RATE_LOW: ${KADMIN_EDGE_DL_RATE_LOW:-640k}
      KADMIN_EDGE_DL_MAXCONN: ${KADMIN_EDGE_DL_MAXCONN:-16}
    ports:
      - "${PEZMAX_EDGE_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/kadmin-proxy-headers.conf:/etc/nginx/kadmin-proxy-headers.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

networks:
  backend:
    name: pezmax-go-backend

volumes:
  postgres_data:
    name: pezmax-go-postgres-data
  redis_data:
    name: pezmax-go-redis-data
  minio_data:
    name: pezmax-go-minio-data
  kadmin_uploads:
    name: pezmax-go-kadmin-uploads
