[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pezmax-agent"
version = "0.1.0"
description = "Local LangGraph resource assistant for PezMax"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.17", "httpx==0.28.1"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
pezmax-agent = "pezmax_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
