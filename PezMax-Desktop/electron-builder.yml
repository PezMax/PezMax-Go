appId: com.electron.app
productName: PezMax
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
win:
  executableName: pezmax
  # Windows 更新发布目标（GitHub Releases，通过 GH 代理供客户端下载）
  # 发布时可用: npx electron-builder --win --publish always
  publish:
    - provider: generic
      url: https://gh-proxy.com/https://github.com/PezMax/PezMax-Go/releases/latest/download
      channel: latest
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # 启用差分/增量更新（生成 .exe.blockmap 文件供增量更新使用）
  differentialPackage: true
  # === 安装向导与目录自定义 ===
  oneClick: false                        # 启用完整安装向导（关闭一键安装）
  perMachine: true                       # 安装到 Program Files（所有用户）
  allowToChangeInstallationDirectory: true # 允许用户选择安装目录
  # 卸载时删除用户数据（%APPDATA%\PezMax：设置、下载库、登录凭据与缓存）。
  # 默认 false 会在卸载后留下数 GB 数据；更新安装（isUpdated）不受影响。
  deleteAppDataOnUninstall: true
  # 自定义卸载脚本：补充清理 NSIS 默认不覆盖的 electron-updater 缓存目录
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # macOS 更新发布目标（支持差分更新）
  publish:
    - provider: generic
      url: https://gh-proxy.com/https://github.com/PezMax/PezMax-Go/releases/latest/download
      channel: latest
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  # Linux 更新发布目标（AppImage 支持差分更新）
  publish:
    - provider: generic
      url: https://gh-proxy.com/https://github.com/PezMax/PezMax-Go/releases/latest/download
      channel: latest
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 全局发布配置（兜底）- 指向 GitHub Releases 最新版本
publish:
  provider: generic
  url: https://gh-proxy.com/https://github.com/PezMax/PezMax-Go/releases/latest/download
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
